<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <!-- Primer cuadro del welcome: se pide de inmediato -->
    <link rel="preload" href="<%= BASE_URL %>welcome-poster.jpg" as="image">
    <!-- Letras: Anton y Spectral del inicio, pixelada del snake y manuscrita de direct -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Press+Start+2P&family=Reenie+Beanie&family=Spectral:wght@400&display=swap">
    <style>
      body { margin: 0; background: #000000; }
      /* Video del welcome: va en el HTML (no en Vue) para que empiece a cargar
         apenas se lee la página, sin esperar al JavaScript. App.vue lo
         lo quita al ganar el snake del welcome */
      #welcome-video {
        position: fixed;
        inset: 0;
        z-index: 9;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000000;
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>Activa JavaScript para ver esta página.</strong>
    </noscript>
    <video
      id="welcome-video"
      src="<%= BASE_URL %>welcome.mp4"
      poster="<%= BASE_URL %>welcome-poster.jpg"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      aria-hidden="true"
    ></video>
    <script>
      // Al refrescar (en el inicio o en otra ruta) no se repite el welcome:
      // solo sale al entrar a la página. App.vue lee window.__skipWelcome
      (function () {
        var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0]
        window.__skipWelcome = !!nav && nav.type === 'reload'
        if (window.__skipWelcome) {
          var video = document.getElementById('welcome-video')
          video.pause()
          video.remove()
        }
      })()
    </script>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Santiago Núñez — Cinematography / DoP</title>
    <meta name="description" content="Santiago Núñez: dirección de fotografía, stills y proyectos audiovisuales. Un pedazo digital de mi mente.">
    <meta name="theme-color" content="#ffffff">
    <!-- Ícono de la pestaña (el de Carite) -->
    <link rel="icon" type="image/png" href="<%= BASE_URL %>favicon.png">
    <link rel="apple-touch-icon" href="<%= BASE_URL %>apple-touch-icon.png">
    <!-- Vista previa al compartir el enlace (WhatsApp, Instagram, X…) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Santiago Núñez">
    <meta property="og:title" content="Santiago Núñez — Cinematography / DoP">
    <meta property="og:description" content="Un pedazo digital de mi mente.">
    <meta property="og:url" content="https://cariteportfolio.vercel.app/">
    <!-- ?v=: subir el número al cambiar la imagen, para que WhatsApp la vuelva a pedir -->
    <meta property="og:image" content="https://cariteportfolio.vercel.app/og-image.jpg?v=2">
    <meta property="og:image:secure_url" content="https://cariteportfolio.vercel.app/og-image.jpg?v=2">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:alt" content="Dos niños abrazados, en blanco y negro">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="es_ES">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://cariteportfolio.vercel.app/og-image.jpg?v=2">
    <!-- Primer cuadro del welcome: se pide de inmediato -->
    <link rel="preload" href="<%= BASE_URL %>welcome-poster.jpg" as="image">
    <!-- Letras: Anton y Spectral (inicio y secciones) y manuscrita de Stills.
         La pixelada del snake la carga el juego solo si está activado -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Reenie+Beanie&family=Spectral:wght@400;700&display=swap">
    <style>
      body { margin: 0; background: #000000; }
      /* Video del welcome: va en el HTML (no en Vue) para que empiece a cargar
         apenas se lee la página, sin esperar al JavaScript. App.vue lo
         lo quita al ganar el snake del welcome */
      #welcome-video {
        position: fixed;
        inset: 0;
        z-index: 9;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000000;
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>Activa JavaScript para ver esta página.</strong>
    </noscript>
    <video
      id="welcome-video"
      src="<%= BASE_URL %>welcome.mp4"
      poster="<%= BASE_URL %>welcome-poster.jpg"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      aria-hidden="true"
    ></video>
    <script>
      // Al refrescar (en el inicio o en otra ruta) no se repite el welcome:
      // solo sale al entrar a la página. App.vue lee window.__skipWelcome
      (function () {
        var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0]
        window.__skipWelcome = !!nav && nav.type === 'reload'
        if (window.__skipWelcome) {
          var video = document.getElementById('welcome-video')
          video.pause()
          video.remove()
        }
      })()
    </script>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
